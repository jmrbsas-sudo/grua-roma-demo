name: Crear APK de Grúa Roma
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Crear versión web
        run: npm run build
      - name: Preparar proyecto Android
        run: npx cap add android
      - name: Sincronizar aplicación
        run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: grua-roma-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
